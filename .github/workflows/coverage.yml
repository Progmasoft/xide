name: Kotlin coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - run: bash ./gradlew :modules:app:jacocoTestReport :modules:document:jacocoTestReport :modules:compiler:jacocoTestReport
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: modules/app/build/reports/jacoco/test/jacocoTestReport.xml,modules/document/build/reports/jacoco/test/jacocoTestReport.xml,modules/compiler/build/reports/jacoco/test/jacocoTestReport.xml
          flags: xide-kotlin
          fail_ci_if_error: true
