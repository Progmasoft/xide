name: Kotlin coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - run: bash ./gradlew :modules:app:jacocoTestReport :modules:document:jacocoTestReport :modules:compiler:jacocoTestReport :modules:syntax:jacocoTestReport :modules:psi:jacocoTestReport
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xide-kotlin-coverage
          path: |
            modules/app/build/reports/jacoco/test/jacocoTestReport.xml
            modules/compiler/build/reports/jacoco/test/jacocoTestReport.xml
            modules/document/build/reports/jacoco/test/jacocoTestReport.xml
            modules/psi/build/reports/jacoco/test/jacocoTestReport.xml
            modules/syntax/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  upload:
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xide-kotlin-coverage
          path: coverage-artifact
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage-artifact/app/build/reports/jacoco/test/jacocoTestReport.xml,coverage-artifact/compiler/build/reports/jacoco/test/jacocoTestReport.xml,coverage-artifact/document/build/reports/jacoco/test/jacocoTestReport.xml,coverage-artifact/syntax/build/reports/jacoco/test/jacocoTestReport.xml,coverage-artifact/psi/build/reports/jacoco/test/jacocoTestReport.xml
          flags: xide-kotlin
          fail_ci_if_error: true
