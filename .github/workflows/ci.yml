name: Kotlin Foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  kotlin-compose-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # Windows checkouts do not preserve the Unix executable bit reliably. Invoke
      # the pinned wrapper through Bash so CI depends on its content, not NTFS mode.
      - name: Test and verify every module
        run: bash ./gradlew check
      # `check` already depends on the Dokka publication. Running it as its own step
      # makes a documentation failure visible by name instead of inside the test log.
      - name: Require KDoc on every public declaration
        run: bash ./gradlew dokkaGenerateHtml
